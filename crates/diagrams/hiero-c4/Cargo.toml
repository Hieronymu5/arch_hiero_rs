[package]
name = "hiero-c4"
description = "C4 model diagrams for Arch Hiero: system context, container, and component diagrams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["ui"]
# The egui properties panels. Off for the MCP server, which needs only the rules.
ui = ["dep:egui", "dep:hiero-editor"]

[dependencies]
hiero-core.workspace = true
serde.workspace = true
egui = { workspace = true, optional = true }
hiero-editor = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
