[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Jeroen Naus <naus.jeroen@gmail.com>"]

[workspace.dependencies]
hiero-core = { path = "crates/hiero-core" }
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep dependencies optimized in debug builds so the UI stays responsive.
[profile.dev.package."*"]
opt-level = 2
